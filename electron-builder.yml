appId: com.renzekta.xlmstudio
productName: XLM Studio
directories:
  buildResources: build
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
extraResources:
  - from: resources/
    to: resources/
  # The icon of the app's windows (resources/icon.png, see src/main/appIcon.ts).
  - from: assets/icon_256.png
    to: icon.png
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/icon_256.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  target: dmg
  icon: assets/icon_1024.png
linux:
  target: AppImage
  # A set of sizes (assets/icons/<size>x<size>.png), so launchers and task bars
  # pick a crisp one instead of scaling a single image.
  icon: assets/icons
  # Electron names its window after desktopName (package.json); the desktop
  # entry's StartupWMClass has to say the same or the desktop cannot tell which
  # entry (and icon) the open window belongs to.
  syncDesktopName: true
