name: Build Installers and Release

# Fully automatic releases, driven by the .github/VERSION file.
#
#   New version   Edit .github/VERSION (e.g. 2.2.0 -> 2.3.0) and push to main.
#                 The installers are built on Windows, Linux and macOS, then a
#                 release and tag 2.3.0 are created with auto-generated notes.
#
#   Same version  Push to main without touching .github/VERSION.
#                   - App code changed: the installers are rebuilt and replace
#                     the ones on the release, and the tag moves to the new
#                     commit, so the source archive matches too.
#                   - Only docs and dev scripts changed: nothing is rebuilt and
#                     only the tag moves.
#                   - Nothing changed since the tag: nothing happens.
#
# package.json and package-lock.json are filled in from .github/VERSION by
# scripts/sync-version.js, so the version is never edited anywhere else. The
# release is only touched after all three platforms built successfully.
# Run it by hand any time: Actions -> Build Installers and Release -> Run
# workflow (optionally forcing a rebuild). Logic lives in
# .github/scripts/release.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild and replace the installers even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.plan.outputs.action }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, to compare against the release tag

      - name: Decide what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: bash .github/scripts/release.sh plan

  build:
    needs: plan
    if: needs.plan.outputs.action == 'create' || needs.plan.outputs.action == 'rebuild'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # a failed platform can be re-run alone
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Keep installers for the release job
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, build]
    if: >-
      ${{ !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.action != 'none'
      && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installers
        if: needs.plan.outputs.action != 'retag'
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTION: ${{ needs.plan.outputs.action }}
        run: bash .github/scripts/release.sh publish installers
